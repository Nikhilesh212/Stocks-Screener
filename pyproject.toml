[project]
name = "equity-research"
version = "0.1.0"
description = "On-demand Indian equity research tools (data fetch + compute + ledger) driven by Claude Code"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.optional-dependencies]
yahoo = [
    "yfinance>=1.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
