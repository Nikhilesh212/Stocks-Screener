# Research mandate. Confirm or change per run in Phase 0 of the equity-research skill.
# Values marked "user-confirmed" were defaults the user accepted on 2026-11-08 (Phase A: use all defaults; confirmed again after hand-over).
horizon_months: 12            # user-confirmed 2026-11-08. >= 12 also qualifies listed equity for long-term capital gains treatment
benchmark: NIFTY 500 TRI
capital_inr: null             # user-confirmed 2026-11-08. optional; used only for liquidity and cost estimates
min_positions: 0              # zero is allowed: "buy the index" or "hold cash" are valid outcomes
max_positions: 10             # user-confirmed 2026-11-08
max_weight: 0.15              # user-confirmed 2026-11-08
max_sector_weight: 0.35       # user-confirmed 2026-11-08
max_drawdown_tolerance: 0.25  # user-confirmed 2026-11-08. portfolio-level tolerance the user is prepared to sit through
liquidity:
  min_adv_inr_crore: 5        # user-confirmed 2026-11-08
  max_days_to_exit: 3         # user-confirmed 2026-11-08
  participation_rate: 0.15    # user-confirmed 2026-11-08
universe: NSE main board      # SME platform excluded by default
exclusions: []                # user-confirmed 2026-11-08. sectors or companies the user doesn't want
include_themes: []            # user-confirmed 2026-11-08
avoid_themes: []              # user-confirmed 2026-11-08
allow_cash: true
instruments: equity_cash_only # no F&O, no leverage, no shorting
